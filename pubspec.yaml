name: otosinyal_obd2
description: "Gerçek zamanlı araç verisi ve arıza teşhisi için OBD2 gösterge paneli uygulaması."
homepage: https://otosinyal.app

version: 1.0.0+15
environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  provider: ^6.1.5+1
  flutter_blue_classic: ^0.0.9
  flutter_blue_plus: ^1.32.12
  permission_handler: ^12.0.1
  device_info_plus: ^12.3.0
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  pdf: ^3.11.3
  path_provider: ^2.1.5
  file_picker: ^11.0.3
  cryptography: ^2.9.0
  lottie: ^3.3.1
  usb_serial: ^0.5.2
  geolocator: ^14.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/svg/
    - assets/images/svg/dashboard/
    - assets/images/svg/bottomBar/
    - assets/images/png/
    - assets/icons/
    - assets/data/
    - assets/data/vag_recovered/
    - assets/brands/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_ico.png"

  adaptive_icon_background: "#080607"
  adaptive_icon_foreground: "assets/icons/icon_foreground.png"

  min_sdk_android: 21
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icons/app_ico.png"

  windows:
    generate: true
    image_path: "assets/icons/app_ico.png"


flutter_native_splash:
  color: "#080607"

  color_dark: "#080607"

  android: true
  ios: true
  web: false

  android_12:
    color: "#080607"
    icon_background_color: "#080607"
