name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show build tools
        run: |
          flutter --version
          xcodebuild -version
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Compile iOS without signing
        run: flutter build ios --release --no-codesign --build-name=1.0 --build-number=1
