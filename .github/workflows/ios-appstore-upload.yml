
name: iOS App Store Upload

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  upload-ipa:
    name: Upload OtoSinyal to App Store Connect
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Find latest successful signed IPA
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow ios-signed-ipa.yml \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')"

          if [[ ! "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Successful iOS Signed IPA run not found." >&2
            exit 1
          fi

          echo "Using signed IPA from run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download signed IPA
        uses: actions/download-artifact@v4
        with:
          name: otosinyal-signed-ipa
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ipa

      - name: Check IPA
        run: |
          set -euo pipefail

          IPA_PATH="$(find "$GITHUB_WORKSPACE/ipa" \
            -maxdepth 1 \
            -type f \
            -name '*.ipa' \
            -print -quit)"

          if [[ -z "$IPA_PATH" ]]; then
            echo "IPA file not found in downloaded artifact." >&2
            exit 1
          fi

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Signed IPA is ready for upload."

      - name: Upload IPA to App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_P8_BASE64: ${{ secrets.APPSTORE_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "$APPSTORE_KEY_ID" ||
                -z "$APPSTORE_ISSUER_ID" ||
                -z "$APPSTORE_KEY_P8_BASE64" ]]; then
            echo "One or more App Store Connect secrets are missing." >&2
            exit 1
          fi

          if [[ ! "$APPSTORE_KEY_ID" =~ ^[A-Za-z0-9]+$ ]]; then
            echo "APPSTORE_KEY_ID has an invalid format." >&2
            exit 1
          fi

          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APPSTORE_KEY_ID}.p8"

          mkdir -p "$KEY_DIR"
          trap 'rm -f "$KEY_PATH"' EXIT

          printf '%s' "$APPSTORE_KEY_P8_BASE64" \
            | base64 -D > "$KEY_PATH"

          chmod 600 "$KEY_PATH"
          test -s "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID" 2>&1 | tee /tmp/upload.txt

      - name: Publish upload log to ci-upload branch
        if: always()
        run: |
          set -e
          mkdir -p /tmp/out
          cp /tmp/upload.txt /tmp/out/upload.txt 2>/dev/null || echo "no upload output" > /tmp/out/upload.txt
          echo "sha=$GITHUB_SHA run=$GITHUB_RUN_ID" > /tmp/out/status.txt
          cd /tmp/out
          git init -q
          git checkout -q -b ci-upload
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "upload log $GITHUB_RUN_ID"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-upload
